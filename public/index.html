<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Aplikasi bisa dipasang di sub-alamat (mis. /pricing/). Alamat file dibuat relatif,
        // jadi alamat halaman harus berakhiran "/": /pricing -> /pricing/
        if (!location.pathname.endsWith('/') && !/\.[a-z0-9]+$/i.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen bg-gradient-to-br from-blue-600 to-indigo-900 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md">
            <div class="flex justify-center mb-6 text-blue-600">
                <i data-lucide="package" class="w-16 h-16"></i>
            </div>
            <h1 class="text-2xl font-bold text-center text-gray-900 mb-2">Pricing Management System</h1>
            <p class="text-center text-gray-500 mb-8">Sign in to your account</p>
            
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </div>
                        <input type="text" id="username" name="username" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </div>
                        <input type="password" id="password" name="password" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                    </div>
                </div>

                <div id="login-error" class="text-red-500 text-sm text-center hidden"></div>
                
                <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 flex items-center justify-center">
                    Sign In
                </button>
            </form>

            <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-100">
                <p class="text-xs text-blue-800 font-medium mb-1">Demo Accounts:</p>
                <ul class="text-xs text-blue-600 space-y-1">
                    <li>admin / admin123</li>
                    <li>user1 / user123</li>
                    <li>supervisor1 / super123</li>
                    <li>atasan1 / atasan123</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Dashboard Shell -->
    <div id="dashboard-shell" class="hidden min-h-screen flex bg-gray-50">
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-slate-800 text-slate-300 w-64 flex-shrink-0 flex flex-col transition-transform duration-300 md:translate-x-0 fixed md:static h-full z-40 -translate-x-full">
            <div class="h-16 flex items-center px-6 bg-slate-900 text-white font-bold text-xl gap-3">
                <i data-lucide="package" class="w-6 h-6 text-blue-500"></i>
                <span>Pricing PMS</span>
            </div>
            
            <div class="p-4 flex-1 overflow-y-auto">
                <nav id="sidebar-menu" class="space-y-1">
                    <!-- Menu items generated by JS -->
                </nav>
            </div>
            
            <div class="p-4 bg-slate-900">
                <button id="logout-btn" class="w-full flex items-center gap-3 px-4 py-2 text-slate-300 hover:text-white hover:bg-slate-700 rounded-lg transition-colors">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
            <!-- Header -->
            <header class="h-16 bg-white border-b flex items-center justify-between px-4 sm:px-6 z-30">
                <div class="flex items-center gap-4">
                    <button id="mobile-menu-btn" class="md:hidden text-gray-500 hover:text-gray-700">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                    <h2 id="page-title" class="text-xl font-semibold text-gray-800">Dashboard</h2>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="text-right hidden sm:block">
                        <div id="user-name" class="text-sm font-medium text-gray-900">John Doe</div>
                        <div id="user-role" class="text-xs text-blue-600 font-medium">Administrator</div>
                    </div>
                    <div id="user-avatar" class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold border-2 border-white shadow-sm">
                        JD
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 overflow-y-auto p-4 sm:p-6 relative">
                <!-- Overlay for mobile sidebar -->
                <div id="sidebar-overlay" class="fixed inset-0 bg-gray-900/50 z-30 hidden md:hidden"></div>
                
                <div id="main-content" class="h-full">
                    <!-- Content injected by JS -->
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/pages/dashboard.js?v=20261012"></script>
    <script src="js/pages/master-biaya.js?v=20261013"></script>
    <script src="js/pages/master-detail-biaya.js?v=20261012"></script>
    <script src="js/pages/master-jasa.js?v=20261012"></script>
    <script src="js/pages/master-kendaraan.js?v=20261012"></script>
    <script src="js/pages/hitung-fix-cost.js?v=20261012"></script>
    <script src="js/pages/history-fix-cost.js?v=20261012"></script>
    <script src="js/pages/history-detail-fix-cost.js?v=20261012"></script>
    <script src="js/pages/konfigurasi-user.js?v=20261012"></script>
    <script src="js/app.js?v=20261013"></script>
</body>
</html>
